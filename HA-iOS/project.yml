# XcodeGen 工程定义：在根目录执行 `xcodegen generate` 即可生成 .xcodeproj
# 要求 Xcode 26+（iOS 26 SDK / Liquid Glass）
name: HA-iOS
options:
  bundleIdPrefix: com.ha.ios
  deploymentTarget:
    iOS: "26.0"

targets:
  HA_iOS:
    type: application
    platform: iOS
    sources:
      - path: HA_iOS
    info:
      path: HA_iOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ha.ios.HA_iOS
        PRODUCT_NAME: HA-iOS
        SWIFT_VERSION: "6.0"
        # Swift 6 语言模式并发检查的迁移缓冲。
        # 代码已做 @MainActor / Sendable 适配，确认全部通过后移除本行即可启用最严格诊断。
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: HA_iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
