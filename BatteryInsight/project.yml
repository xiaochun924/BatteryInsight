# XcodeGen 工程定义：根目录执行 `xcodegen generate` 生成 .xcodeproj
name: BatteryInsight
options:
  bundleIdPrefix: com.audi.battery
  deploymentTarget:
    iOS: "16.0"
  # 生成时把 xcassets 的 AppIcon 自动接上，避免图标缺失
  generateEmptyDirectories: true

targets:
  BatteryInsight:
    type: application
    platform: iOS
    sources:
      - path: BatteryInsight
    info:
      path: BatteryInsight/Info.plist
      properties:
        # 关键的启动图配置：iOS 全屏渲染依赖它。
        # 裸 <dict/> 在部分 Xcode/iOS 组合下会被判为「无启动图」，
        # 系统随后按兼容模式以缩小尺寸渲染 —— 这正是「窗口没铺满」的表现。
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audi.battery.BatteryInsight
        PRODUCT_NAME: BatteryInsight
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: BatteryInsight/Info.plist
        # 仅 iPhone；iPad 由系统以兼容模式运行，不影响 iPhone 全屏
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
