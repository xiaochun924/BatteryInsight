name: iOS Build (Unsigned IPA)

# 产出未签名的 .ipa，供你下载后用自有证书重签名
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.project }}
    # iOS 26 SDK / 液态玻璃需要 Xcode 26；若镜像未带 Xcode 26，把此处改为 macos-26
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project: [BatteryInsight]
        scheme: [BatteryInsight]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 与 iOS SDK 版本
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          cd "${{ matrix.project }}"
          xcodegen generate

      - name: 编译（iOS 真机 SDK / Release / 关闭签名）
        run: |
          set -o pipefail
          cd "${{ matrix.project }}"
          xcodebuild \
            -project "${{ matrix.project }}.xcodeproj" \
            -scheme "${{ matrix.scheme }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tail -40

      - name: 打包未签名 IPA
        run: |
          cd "${{ matrix.project }}"
          APP=$(find build -type d -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物"; exit 1
          fi
          echo "产物: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr "../${{ matrix.project }}-unsigned.ipa" Payload
          ls -lh "../${{ matrix.project }}-unsigned.ipa"

      - name: 上传未签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-unsigned-ipa
          path: ${{ matrix.project }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
